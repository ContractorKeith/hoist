name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hoist/caddy
          key: caddy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/caddy-binary.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run test:e2e
      - run: bun run build && ./dist/hoist version
