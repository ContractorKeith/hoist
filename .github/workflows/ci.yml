name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hoist/caddy
          key: caddy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/caddy-binary.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Ensure OpenSSH server is installed
        run: test -x /usr/sbin/sshd || sudo apt-get install -y openssh-server
      - name: Verify e2e ran and teardown succeeded
        shell: bash
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee /tmp/hoist-e2e.log
          grep -Fx ' 13 pass' /tmp/hoist-e2e.log
          grep -Fx ' 0 fail' /tmp/hoist-e2e.log
          skip_summary=$(awk '/^\(skip\)/ { count++ } END { printf " %d skip", count }' /tmp/hoist-e2e.log)
          printf '%s\n' "$skip_summary" >> /tmp/hoist-e2e.log
          grep -Fx ' 0 skip' /tmp/hoist-e2e.log
          grep -F 'Teardown verified' /tmp/hoist-e2e.log
      - run: bun run build && ./dist/hoist version
