name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hoist/caddy
          key: caddy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/adapters/caddy-binary.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Ensure OpenSSH server is installed
        run: test -x /usr/sbin/sshd || sudo apt-get install -y openssh-server
      - name: Verify e2e ran and teardown succeeded
        shell: bash
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee /tmp/hoist-e2e.log
          grep -Eq '^ [1-9][0-9]* pass$' /tmp/hoist-e2e.log
          grep -Fx ' 0 fail' /tmp/hoist-e2e.log
          grep -F 'Teardown verified' /tmp/hoist-e2e.log
      - run: bun run build && ./dist/hoist version
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: mkdir -p .tmp && bun run release:check
      - run: .tmp/hoist-linux-x64 version
      - run: docker run --rm --platform linux/arm64 -v "$PWD/.tmp:/release:ro" ubuntu:24.04 /release/hoist-linux-arm64 version
      - run: sh -n install.sh
      - run: if command -v shellcheck >/dev/null; then shellcheck install.sh; else echo "shellcheck absent"; fi
