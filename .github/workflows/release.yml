name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - name: Assemble checksums and release notes
        shell: bash
        run: |
          cd .tmp
          sha256sum hoist-linux-x64 hoist-linux-arm64 > checksums.txt
          ./hoist-linux-x64 version
          cd ..
          awk '/^## / { if (found) exit; if ($2 == "0.1.0") { found=1; next } } found' CHANGELOG.md > .tmp/notes.md
          test -s .tmp/notes.md
      - name: Run arm64 binary
        run: docker run --rm --platform linux/arm64 -v "$PWD/.tmp:/release:ro" ubuntu:24.04 /release/hoist-linux-arm64 version
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .tmp/hoist-linux-x64 .tmp/hoist-linux-arm64 .tmp/checksums.txt install.sh
          --title "hoist $GITHUB_REF_NAME" --notes-file .tmp/notes.md
